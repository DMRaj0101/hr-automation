# version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: onboarding_poc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mock_hrms:
    build: ./mock_hrms
    ports:
      - "9000:9000"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/onboarding_poc
      MOCK_HRMS_URL: http://mock_hrms:9000
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gpt-oss:120b-cloud
      JWT_SECRET: poc-dev-secret-change-me
      # TODO: add KEYCLOAK_*, MAILU_*, KIMAI_*, SNIPEIT_* once each
      # connector is implemented -- see backend/.env.example (repo root
      # .env.example) for the full list of vars each owner needs to fill in.
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mock_hrms
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

################################################################################
# KEYCLOAK
################################################################################

  keycloak-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    restart: always
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

################################################################################
# MAILU
################################################################################

  resolver:
    image: ghcr.io/mailu/unbound:2024.06
    restart: always
    env_file:
      - mailu.env
    networks:
      default:
        ipv4_address: 192.168.203.254

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./mailu/redis:/data
    depends_on:
      - resolver
    dns:
      - 192.168.203.254

  front:
    image: ghcr.io/mailu/nginx:2024.06
    restart: always
    env_file:
      - mailu.env
    ports:
      - "8081:80"
      - "8443:443"
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "995:995"
      - "143:143"
      - "993:993"
      - "4190:4190"
    networks:
      - default
      - webmail
    volumes:
      - ./mailu/certs:/certs
      - ./mailu/overrides/nginx:/overrides:ro
    depends_on:
      - resolver
    dns:
      - 192.168.203.254

  admin:
    image: ghcr.io/mailu/admin:2024.06
    restart: always
    env_file:
      - mailu.env
    volumes:
      - ./mailu/data:/data
      - ./mailu/dkim:/dkim
    depends_on:
      - redis
      - resolver
    dns:
      - 192.168.203.254

  smtp:
    image: ghcr.io/mailu/postfix:2024.06
    restart: always
    env_file:
      - mailu.env
    volumes:
      - ./mailu/mailqueue:/queue
      - ./mailu/overrides/postfix:/overrides:ro
    depends_on:
      - front
      - resolver
    dns:
      - 192.168.203.254

  imap:
    image: ghcr.io/mailu/dovecot:2024.06
    restart: always
    env_file:
      - mailu.env
    volumes:
      - ./mailu/mail:/mail
      - ./mailu/overrides/dovecot:/overrides:ro
    depends_on:
      - front
      - resolver
    dns:
      - 192.168.203.254

  oletools:
    image: ghcr.io/mailu/oletools:2024.06
    restart: always
    hostname: oletools
    networks:
      - oletools
    depends_on:
      - resolver
    dns:
      - 192.168.203.254

  antispam:
    image: ghcr.io/mailu/rspamd:2024.06
    restart: always
    env_file:
      - mailu.env
    hostname: antispam
    networks:
      - default
      - oletools
    volumes:
      - ./mailu/filter:/var/lib/rspamd
      - ./mailu/overrides/rspamd:/overrides:ro
    depends_on:
      - front
      - redis
      - oletools
      - resolver
    dns:
      - 192.168.203.254

  webmail:
    image: ghcr.io/mailu/webmail:2024.06
    restart: always
    env_file:
      - mailu.env
    networks:
      - webmail
    volumes:
      - ./mailu/webmail:/data
      - ./mailu/overrides/snappymail:/overrides:ro
    depends_on:
      - front

################################################################################

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.203.0/24

  webmail:
    driver: bridge

  oletools:
    driver: bridge
    internal: true

volumes:
  pgdata:
  keycloak-db-data: